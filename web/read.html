<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scene="lamplit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yt-vault · reading room</title>
  <link rel="stylesheet" href="/web/base.css">
  <link rel="stylesheet" href="/web/read.css">
</head>
<body>
  <!-- scene background -->
  <div id="scene" class="scene" aria-hidden="true">
    <div class="scene-grain"></div>
    <div class="scene-rain"></div>
    <div class="scene-dust"></div>
    <img id="customBg" class="scene-custom" alt="" hidden>
  </div>

  <header class="topbar glass-bar">
    <a class="brand" href="/"><span class="brand-mark"></span>yt<span class="brand-dim">·</span>vault</a>
    <nav class="nav">
      <a class="nav-link" href="/">Get transcript</a>
      <a class="nav-link" href="/read" aria-current="page">Reading room</a>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme"><span class="theme-dot"></span></button>
    </nav>
  </header>

  <!-- left dock -->
  <aside class="dock" aria-label="Reading room controls">
    <button class="dock-btn" data-pop="scenes" title="Scenes" aria-label="Scenes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.7 0 1.7-2 0-2.5s-1.5-2.5 0-3 3 .5 3-2-2.5-2-1.5-4 1.2-3.2-.5-4.5z"/></svg>
    </button>
    <button class="dock-btn" data-widget="library" title="Transcripts" aria-label="Transcripts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h11v15H6a2 2 0 0 1-2-2z"/><path d="M15 5h5v13a2 2 0 0 1-2 2h-3z"/><path d="M8 9h4M8 13h4"/></svg>
    </button>
    <button class="dock-btn" data-widget="clock" title="Clock" aria-label="Clock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="dock-btn" data-widget="timer" title="Timer" aria-label="Pomodoro timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2h4"/><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/></svg>
    </button>
    <button class="dock-btn" data-widget="life" title="Life in progress" aria-label="Life progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h7l1.5-4 3 8L16 12h5"/></svg>
    </button>
  </aside>

  <!-- scenes popover -->
  <div id="scenesPop" class="pop" hidden role="dialog" aria-label="Choose a scene">
    <p class="pop-title">Choose your room</p>
    <div class="scene-grid" id="sceneGrid"></div>
    <label class="upload">
      <input id="bgUpload" type="file" accept="image/*" hidden>
      <span>Upload your own background</span>
    </label>
  </div>

  <!-- shelf (transcript list) -->
  <aside id="shelf" class="shelf glass" aria-label="Saved transcripts" hidden>
    <div class="shelf-head"><h2>Transcripts</h2><button class="x" id="shelfClose" aria-label="Close">×</button></div>
    <input id="filter" class="filter" type="search" placeholder="Filter by title or channel" aria-label="Filter">
    <ol id="list" class="list"></ol>
    <p id="shelfEmpty" class="muted-note">Nothing here yet. <a href="/">Add one →</a></p>
  </aside>

  <!-- reader -->
  <main class="room">
    <article id="reader" class="reader glass" tabindex="-1">
      <div id="readerEmpty" class="reader-empty">
        <span class="ember"></span>
        <p>Pick something to read.</p>
        <button class="ghost-btn" id="openShelf">Browse transcripts</button>
      </div>
      <div id="readerBody" class="reader-body" hidden></div>
    </article>
  </main>

  <!-- widgets -->
  <section id="w-clock" class="widget glass" data-w="clock" hidden>
    <div class="widget-grip" data-grip></div>
    <div class="clock-time" id="clockTime">--:--</div>
    <div class="clock-date" id="clockDate"></div>
    <select id="clockTz" class="mini-select" aria-label="Timezone"></select>
  </section>

  <section id="w-timer" class="widget glass" data-w="timer" hidden>
    <div class="widget-grip" data-grip></div>
    <div class="timer-modes">
      <button class="chip active" data-mode="focus" data-min="25">Focus</button>
      <button class="chip" data-mode="break" data-min="5">Break</button>
    </div>
    <div class="timer-time" id="timerTime">25:00</div>
    <div class="timer-actions">
      <button class="ghost-btn" id="timerToggle">Start</button>
      <button class="ghost-btn" id="timerReset">Reset</button>
    </div>
  </section>

  <section id="w-life" class="widget glass" data-w="life" hidden>
    <div class="widget-grip" data-grip></div>
    <p class="widget-label">Time, honestly</p>
    <div class="bar-row"><span>This year</span><span id="yearPct">—</span></div>
    <div class="bar"><i id="yearBar"></i></div>
    <div class="bar-row"><span>Life</span><span id="lifePct">—</span></div>
    <div class="bar"><i id="lifeBar"></i></div>
    <div class="life-inputs">
      <input id="birth" type="date" aria-label="Birth date">
      <input id="expectancy" type="number" min="40" max="120" value="80" aria-label="Life expectancy">
    </div>
  </section>

  <script src="/web/read.js" defer></script>
</body>
</html>
